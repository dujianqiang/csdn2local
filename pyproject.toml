[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "csdn2local"
version = "0.1.0"
description = "Archive public CSDN articles as local HTML and PDF files"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "lxml>=5.3,<6",
    "loguru>=0.7,<1",
    "playwright>=1.48,<2",
    "python-multipart>=0.0.9,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "respx>=0.21,<1",
]

[project.scripts]
csdn2local = "app.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html"]
