<details class="advanced upload-options">
  <summary>补充浏览器另存的文章</summary>
  <div class="field">
    <p id="article-html-help" class="hint">打开原文后另存为「网页，仅 HTML」，用地址末尾的文章 ID 命名，例如 <code>148028338.html</code>。可以一次选择多个文件。</p>
    <label for="article-html">文章 HTML 文件</label>
    <input id="article-html" name="article_html" type="file" accept=".html,.htm,text/html" multiple aria-describedby="article-html-help">
  </div>
</details>
