schema: spec-driven

context: |
  Project name: csdn2local
  Product scope: download public CSDN articles and columns or topics for offline use.
  Product capabilities: csdn-single-url-download (单个网页下载), csdn-topic-download (栏目批量下载), frontend-experience (样式优化).
  Keep one canonical specification per product capability. File format and archive layout changes belong to the affected download capabilities.
  Project documents are maintained in Chinese; implementation identifiers may remain English.
  Follow AGENTS.md. Keep all pre-release fixes and verification in the original change.
  The user confirms release readiness and owns main-spec synchronization and archiving.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
